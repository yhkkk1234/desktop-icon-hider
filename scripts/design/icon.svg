<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 分区收纳：圆角分区框 + 2x2 图标栅格，右下方块错位表示"拖入分区" -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d8cff"/>
      <stop offset="1" stop-color="#3b4bd8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="0.4" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- 分区框底座 -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#shine)"/>
  <rect x="19" y="19" width="218" height="218" rx="53" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="6"/>

  <!-- 2x2 图标栅格（半透明次方块） -->
  <rect x="70" y="70" width="52" height="52" rx="14" fill="rgba(255,255,255,0.55)"/>
  <rect x="134" y="70" width="52" height="52" rx="14" fill="rgba(255,255,255,0.55)"/>
  <rect x="70" y="134" width="52" height="52" rx="14" fill="rgba(255,255,255,0.55)"/>

  <!-- 焦点方块：错位表示被拖入分区 -->
  <rect x="146" y="146" width="52" height="52" rx="14" fill="rgba(255,255,255,0.96)"/>
</svg>
