appId: com.desktopiconhider.app
productName: Desktop Icon Hider
copyright: Copyright © 2024
electronVersion: 43.3.0

directories:
  output: dist
  buildResources: build

# 注意：electron-builder.yml 优先于 package.json 的 build 字段，
# 因此所有打包配置必须在此维护（package.json 中不再保留 build 键）。
files:
  - "src/**/*"
  - "assets/**/*"
  - "build/Release/*.node"
  - "package.json"
  - "binding.gyp"
  - "!**/node_modules/**/{TEST,test,tests,__tests__}/**"
  - "!**/node_modules/**/{README,readme}/**"
  - "!**/node_modules/**/{LICENSE,license}/**"
  - "!**/node_modules/**/{CONTRIBUTING,contributing}/**"
  - "!**/node_modules/**/{CHANGELOG,changelog}/**"
  - "!**/node_modules/**/{.github,.git}/**"

# 原生模块必须从 asar 解包，否则 require 失败
asarUnpack:
  - build/Release/*.node
  - node_modules/better-sqlite3/**/*.node

# 性能监控采样脚本 + LibreHardwareMonitorLib 运行时
# 许可：LibreHardwareMonitorLib 0.9.4 = MPL-2.0（github.com/LibreHardwareMonitor/LibreHardwareMonitor）
#       HidSharp 2.1.0 = Apache-2.0（其传递依赖，勿误记为 MPL）
# 二者均为原样分发、未修改；完整声明见 THIRD_PARTY_NOTICES.md
extraResources:
  - from: native/hardware
    to: hardware
    filter:
      - "**/*"
  # 随发行包一同提供第三方许可声明（MPL-2.0 / Apache-2.0 的分发要求）
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

# 关闭打包时的自动重建：本机 Windows SDK 版本不匹配会导致 node-gyp 重编译失败，
# 原生模块（icon_extractor / better-sqlite3）由 build-native.ps1 预先编译
npmRebuild: false
buildDependenciesFromSource: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Desktop Icon Hider
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish:
  provider: github
  owner: yhkkk1234
  repo: desktop-icon-hider
