appId: com.desktopiconhider.app
productName: Desktop Icon Hider
copyright: Copyright © 2024
electronVersion: 27.0.0

directories:
  output: dist
  buildResources: build

# 注意：electron-builder.yml 优先于 package.json 的 build 字段，
# 因此所有打包配置必须在此维护（package.json 中不再保留 build 键）。
files:
  - "src/**/*"
  - "assets/**/*"
  - "build/Release/*.node"
  - "package.json"
  - "binding.gyp"
  - "!**/node_modules/**/{TEST,test,tests,__tests__}/**"
  - "!**/node_modules/**/{README,readme}/**"
  - "!**/node_modules/**/{LICENSE,license}/**"
  - "!**/node_modules/**/{CONTRIBUTING,contributing}/**"
  - "!**/node_modules/**/{CHANGELOG,changelog}/**"
  - "!**/node_modules/**/{.github,.git}/**"

# 原生模块必须从 asar 解包，否则 require 失败
asarUnpack:
  - build/Release/*.node

npmRebuild: true
buildDependenciesFromSource: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Desktop Icon Hider
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish:
  provider: github
  owner: your-username
  repo: desktop-icon-hider
