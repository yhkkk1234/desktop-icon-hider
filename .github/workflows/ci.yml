# CI：每次 push / PR 都跑 lint 与单元测试
#
# 为什么锁 windows-latest：本应用是 Windows 专属（desktop-api 走 Win32/COM、
# 采样脚本走 LibreHardwareMonitor + PowerShell、打包目标是 NSIS/portable），
# 在 Linux/macOS runner 上跑不出有效信号。
#
# 单元测试不需要原生模块：agent-monitor 懒加载 better-sqlite3 并在缺失时降级为空列表，
# desktop-api 在 icon_extractor.node 缺失时降级为 emoji 图标，
# 测试全部注入假 fs / 假 Database（见 jest.setup.js 对 electron 与 electron-store 的 mock）。
# 因此这里用 --ignore-scripts 跳过 Electron 运行时下载与原生模块编译，缩短 CI 时间。
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      # 不下载 Electron 运行时（约 100MB）：lint 与 jest 都用不到
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts：跳过 Electron 二进制下载与根包的原生模块编译。
        # 本地/发布用的原生编译由 scripts/native-build.js（install 钩子）与
        # build-native.ps1 负责，两者都不在 CI 的验证范围内。
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci
